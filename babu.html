    --rose: #e8607b;
    --rose-deep: #b23a54;
    --blush: #fbd8ce;
    --gold: #d9a05b;
    --ring: rgba(232, 96, 123, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --cream: #241620;
      --cream-2: #2e1a28;
      --card: #33202c;
      --plum: #fdede6;
      --plum-soft: #d9b8c8;
      --rose: #ff8ba0;
      --rose-deep: #ffb0be;
      --blush: #452832;
      --gold: #e8b679;
      --ring: rgba(255, 139, 160, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --cream: #241620;
    --cream-2: #2e1a28;
    --card: #33202c;
    --plum: #fdede6;
    --plum-soft: #d9b8c8;
    --rose: #ff8ba0;
    --rose-deep: #ffb0be;
    --blush: #452832;
    --gold: #e8b679;
    --ring: rgba(255, 139, 160, 0.35);
  }

  :root[data-theme="light"] {
    --cream: #fff3ec;
    --cream-2: #ffe8dd;
    --card: #fffaf7;
    --plum: #3b2436;
    --plum-soft: #7a5468;
    --rose: #e8607b;
    --rose-deep: #b23a54;
    --blush: #fbd8ce;
    --gold: #d9a05b;
    --ring: rgba(232, 96, 123, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--cream-2), var(--cream) 60%);
    color: var(--plum);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 56px;
    overflow-x: hidden;
    position: relative;
  }

  #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .stamp {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rose-deep);
    background: var(--blush);
    border: 1.5px dashed var(--rose);
    border-radius: 999px;
    padding: 7px 16px;
  }

  .card {
    width: 100%;
    background: var(--card);
    border-radius: 28px;
    padding: 38px 30px 32px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 20px 45px -22px rgba(59, 36, 54, 0.35);
    text-align: center;
    position: relative;
  }

  h1 {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(2.6rem, 11vw, 3.4rem);
    margin: 0 0 4px;
    color: var(--rose-deep);
    text-wrap: balance;
    line-height: 1;
  }

  .message {
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--plum);
    min-height: 5.6em;
    margin: 18px 0 6px;
  }

  .message .cursor {
    display: inline-block;
    width: 2px;
    background: var(--rose);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .signature {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: 1.5rem;
    color: var(--plum-soft);
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.6s ease 0.2s;
  }

  .signature.show { opacity: 1; }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 26px 0 18px;
    color: var(--plum-soft);
  }

  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--blush), transparent);
  }

  .divider span {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    white-space: nowrap;
  }

  .line-box {
    min-height: 3.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
  }

  #cuteLine {
    font-size: 1.12rem;
    line-height: 1.5;
    color: var(--rose-deep);
    font-weight: 500;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  #cuteLine.fade {
    opacity: 0;
    transform: translateY(6px);
  }

  button {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  button:focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--rose);
    color: #fff8f6;
    padding: 13px 26px;
    box-shadow: 0 10px 24px -10px rgba(232, 96, 123, 0.65);
  }

  .btn-primary:hover { transform: translateY(-2px); }
  .btn-primary:active { transform: translateY(0) scale(0.98); }

  .hug-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .hug-btn {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--blush);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    box-shadow: 0 12px 26px -14px rgba(232, 96, 123, 0.55);
  }

  .hug-btn:active { transform: scale(0.94); }

  .hug-count {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--plum-soft);
    letter-spacing: 0.02em;
  }

  .hug-count b {
    color: var(--rose-deep);
    font-variant-numeric: tabular-nums;
  }

  .burst {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .burst-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    font-size: 1.1rem;
    animation: burst-fly var(--dur, 0.9s) ease-out forwards;
  }

  @keyframes burst-fly {
    to {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.6);
      opacity: 0;
    }
  }

  .footnote {
    font-size: 0.72rem;
    color: var(--plum-soft);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    .message .cursor { animation: none; }
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="stage">
    <span class="stamp">Special Delivery, for Babu 💌</span>

    <div class="card">
      <h1>Hey Babu,</h1>
      <p class="message" id="message"><span id="typed"></span><span class="cursor" id="cursor"></span></p>
      <p class="signature" id="sig">— tumhara hi kuch 🫂</p>

      <div class="divider"><span>One More Thing</span></div>

      <div class="line-box">
        <p id="cuteLine">Tap the button, thoda aur pyaar bhejta/bhejti hoon 👇</p>
      </div>
      <button class="btn-primary" id="lineBtn" type="button">Send more love 💗</button>
    </div>

    <div class="hug-row">
      <button class="hug-btn" id="hugBtn" type="button" aria-label="Send a hug">
        🫂
        <span class="burst" id="burst"></span>
      </button>
      <p class="hug-count">hugs sent so far: <b id="hugCount">0</b></p>
      <p class="footnote">jitna zyada tap karogi, utna zyada pyaar 🥺💗</p>
    </div>
  </main>

<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var fullMessage = "Missing you missing you ho raha hai thoda sa... 🥺\nBas itna batane aaya/aayi hoon ki tum yaad aa rahi ho, aur har second thodi zyada.";
  var typedEl = document.getElementById('typed');
  var cursorEl = document.getElementById('cursor');
  var sigEl = document.getElementById('sig');

  function typeMessage() {
    if (reduceMotion) {
      typedEl.textContent = fullMessage;
      cursorEl.style.display = 'none';
      sigEl.classList.add('show');
      return;
    }
    var i = 0;
    var speed = 32;
    function step() {
      if (i <= fullMessage.length) {
        typedEl.textContent = fullMessage.slice(0, i);
        i++;
        setTimeout(step, speed);
      } else {
        cursorEl.style.display = 'none';
        sigEl.classList.add('show');
      }
    }
    setTimeout(step, 400);
  }
  typeMessage();

  var lines = [
    "Tumhare bina din adhoora lagta hai, Babu 🥺",
    "You're the notification I actually check my phone for 📱💗",
    "Agar missing you ek job hoti, main already sabse zyada dedicated employee hoon 😩💕",
    "Har cute cheez dekh ke bas tumhi yaad aati ho 🐻",
    "Aaj ka mood: thoda dramatic, thoda in love, poora tumhara",
    "Distance ka ek hi fayda hai — jab milte hain, dil aur zyada khush ho jaata hai 💕",
    "Tum + main = forever ka sabse best plan",
    "Chalo ek kaam karte hain — tum bas smile karo, baaki dekh liya jayega 😌",
    "Tumhe itna miss kar rahi/raha hoon ki apna phone bhi jealous ho gaya 📵💘",
    "PS: tum duniya ki sabse cute Babu ho, koi arguments nahi 🙅‍♀️💗"
  ];
  var used = [];
  var lineEl = document.getElementById('cuteLine');
  var lineBtn = document.getElementById('lineBtn');

  function nextLine() {
    if (used.length === lines.length) used = [];
    var idx;
    do { idx = Math.floor(Math.random() * lines.length); } while (used.indexOf(idx) !== -1);
    used.push(idx);
    return lines[idx];
  }

  lineBtn.addEventListener('click', function () {
    if (reduceMotion) {
      lineEl.textContent = nextLine();
      return;
    }
    lineEl.classList.add('fade');
    setTimeout(function () {
      lineEl.textContent = nextLine();
      lineEl.classList.remove('fade');
    }, 220);
  });

  var hugBtn = document.getElementById('hugBtn');
  var hugCountEl = document.getElementById('hugCount');
  var burst = document.getElementById('burst');
  var STORAGE_KEY = 'babu-hug-count';
  var count = 0;
  try { count = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0; } catch (e) {}
  hugCountEl.textContent = count;

  var hugEmojis = ['💗','💕','🥰','💖','😘','🫶'];

  hugBtn.addEventListener('click', function () {
    count++;
    hugCountEl.textContent = count;
    try { localStorage.setItem(STORAGE_KEY, String(count)); } catch (e) {}

    if (reduceMotion) return;

    var n = 6;
    for (var k = 0; k < n; k++) {
      var el = document.createElement('span');
      el.className = 'burst-heart';
      el.textContent = hugEmojis[Math.floor(Math.random() * hugEmojis.length)];
      var angle = (Math.PI * 2 * k) / n + Math.random() * 0.5;
      var dist = 46 + Math.random() * 30;
      el.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      el.style.setProperty('--dy', (Math.sin(angle) * dist - 20) + 'px');
      el.style.setProperty('--dur', (0.7 + Math.random() * 0.4) + 's');
      burst.appendChild(el);
      (function (node) {
        setTimeout(function () { node.remove(); }, 1200);
      })(el);
    }
  });

  // Ambient floating hearts/stars
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W, H, dpr;
  var particles = [];
  var glyphs = ['💗', '✨', '💕', '⭐'];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeParticle() {
    return {
      x: Math.random() * W,
      y: H + 30 + Math.random() * H * 0.5,
      size: 12 + Math.random() * 14,
      speed: 0.25 + Math.random() * 0.5,
      drift: (Math.random() - 0.5) * 0.4,
      glyph: glyphs[Math.floor(Math.random() * glyphs.length)],
      opacity: 0.15 + Math.random() * 0.35,
      sway: Math.random() * Math.PI * 2
    };
  }

  var particleCount = 16;

  function initParticles() {
    particles = [];
    for (var i = 0; i < particleCount; i++) {
      var p = makeParticle();
      p.y = Math.random() * H;
      particles.push(p);
    }
  }

  function drawStatic() {
    resize();
    initParticles();
    ctx.clearRect(0, 0, W, H);
    particles.forEach(function (p) {
      ctx.globalAlpha = p.opacity;
      ctx.font = p.size + 'px sans-serif';
      ctx.fillText(p.glyph, p.x, p.y);
    });
    ctx.globalAlpha = 1;
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(function (p) {
      p.y -= p.speed;
      p.sway += 0.01;
      p.x += Math.sin(p.sway) * p.drift;
      if (p.y < -30) {
        var np = makeParticle();
        p.x = np.x; p.y = H + 20; p.size = np.size; p.speed = np.speed;
        p.drift = np.drift; p.glyph = np.glyph; p.opacity = np.opacity; p.sway = np.sway;
      }
      ctx.globalAlpha = p.opacity;
      ctx.font = p.size + 'px sans-serif';
      ctx.fillText(p.glyph, p.x, p.y);
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', function () {
    if (reduceMotion) { drawStatic(); } else { resize(); }
  });

  if (reduceMotion) {
    drawStatic();
  } else {
    resize();
    initParticles();
    animate();
  }
})();
</script>
</body>
</html>
